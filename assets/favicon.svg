<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e1c" />
      <stop offset="50%" stop-color="#06060c" />
      <stop offset="100%" stop-color="#0a0a16" />
    </linearGradient>

    <!-- Brand Blue to Cyan Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <!-- Cyan to Indigo Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle with Glowing Border -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#brandGrad)" stroke-width="6" stroke-opacity="0.6" />

  <!-- Subtle Inner Ring -->
  <rect x="26" y="26" width="460" height="460" rx="98" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-opacity="0.25" />

  <!-- Code Bracket Left '<' -->
  <path d="M 124 216 L 76 256 L 124 296" fill="none" stroke="url(#cyanGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

  <!-- Code Bracket Right '>' -->
  <path d="M 388 216 L 436 256 L 388 296" fill="none" stroke="url(#brandGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

  <!-- Monogram 'd' (White stem & loop) -->
  <path d="M 220 160 V 352" stroke="#f0f0fa" stroke-width="28" stroke-linecap="round" />
  <path d="M 220 256 C 220 216, 154 216, 154 256 C 154 296, 220 296, 220 256 Z" fill="none" stroke="#f0f0fa" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Monogram 'R' (Gradient blue/cyan) -->
  <path d="M 276 352 V 224 H 322 C 352 224, 352 272, 322 272 H 276" fill="none" stroke="url(#brandGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 314 272 L 348 352" stroke="url(#brandGrad)" stroke-width="28" stroke-linecap="round" />

  <!-- Glowing Accent Dot -->
  <circle cx="372" cy="172" r="12" fill="#22d3ee" filter="url(#glow)" />
</svg>
